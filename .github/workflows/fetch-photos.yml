name: Fetch dog photos

on:
  push:
    branches: ["claude/**"]
    paths: ["scripts/photo-sources.json", "scripts/fetch_photos.py", ".github/workflows/fetch-photos.yml"]
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"   # hourly; Wikimedia allows only a few photos per hour, so this finishes over about a day

permissions:
  contents: write

concurrency:
  group: fetch-photos
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Always work on the review branch (scheduled runs start from main); photos go live only after review.
          ref: claude/exciting-shannon-aw3cb3
      - name: Install Pillow
        run: pip install --quiet pillow
      - name: Download photos from Wikimedia (stops after 50 min; progress is saved)
        run: timeout 3000 python3 scripts/fetch_photos.py || echo "time limit reached; saving what we have"
      - name: Commit downloaded photos
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in images/photos images/banners images/photo-credits-new.json photo-candidates; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Fetch dog photos from Wikimedia"
          git pull --rebase origin claude/exciting-shannon-aw3cb3
          git push origin HEAD:claude/exciting-shannon-aw3cb3
