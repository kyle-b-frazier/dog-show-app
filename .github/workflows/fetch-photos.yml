name: Fetch dog photos

on:
  push:
    branches: ["claude/**"]
    paths: ["scripts/photo-sources.json", "scripts/fetch_photos.py", ".github/workflows/fetch-photos.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-photos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download photos from Wikimedia
        run: python3 scripts/fetch_photos.py
      - name: Commit downloaded photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in images/photos images/banners images/photo-credits-new.json photo-candidates; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Fetch dog photos from Wikimedia"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
